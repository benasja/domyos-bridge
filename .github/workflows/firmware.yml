# Builds the firmware for every supported chip, runs the host tests, and
# publishes the browser installer (site/) to GitHub Pages. A pushed tag like
# v1.2.0 also attaches the binaries to a GitHub release.
name: firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake and Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build and run
        env:
          CXX: clang++
        run: |
          cmake -S test -B build-test -G Ninja
          cmake --build build-test
          ctest --test-dir build-test --output-on-failure

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [esp32c3, esp32s3, esp32]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe gives the firmware its version
      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.1
          target: ${{ matrix.target }}
          command: >-
            git config --global --add safe.directory '*' &&
            idf.py set-target ${{ matrix.target }} build &&
            cd build &&
            esptool.py --chip ${{ matrix.target }} merge_bin
            -o ../domyos-bridge-${{ matrix.target }}.bin @flash_args
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}
          path: domyos-bridge-${{ matrix.target }}.bin

  pages:
    if: github.event_name != 'pull_request'
    needs: [host-tests, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # release upload on tags
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: site/firmware
      - name: Write the installer manifest
        run: |
          version="$(git describe --tags --always)"
          sed "s/@VERSION@/$version/" site/manifest.template.json > site/manifest.json
          rm site/manifest.template.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Attach binaries to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: site/firmware/*.bin
